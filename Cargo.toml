[workspace]
# The server CLI is the root package; `cargo build` and `cargo test` at the
# root build only it, so the VPS build needs no desktop libraries.
members = ["app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/vantalter/runberth"

[package]
name = "runberth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Lightweight GitHub Actions runner management for one small Linux host"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64 = "0.22"
libc = "0.2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
