[package]
name = "runberth"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Lightweight GitHub Actions runner management for one small Linux host"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
libc = "0.2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
