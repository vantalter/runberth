name: Release

# Push a tag such as v0.1.0 to publish a static Linux x86_64 binary and its
# SHA-256 checksum. The VPS needs neither Rust nor a C toolchain.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-unknown-linux-musl
      ASSET: runberth-x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Install the musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$TARGET"
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          cp "target/$TARGET/release/runberth" "$ASSET"
          "./$ASSET" --version
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --title "$GITHUB_REF_NAME" --generate-notes
