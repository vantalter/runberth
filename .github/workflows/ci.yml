name: CI

# GitHub-hosted runners: this repository is public, and a self-hosted runner
# must never run workflows from pull requests that anyone can open.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Shell scripts
        run: shellcheck scripts/*.sh app/scripts/*.sh app/macos/build-rust.sh

  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test on the minimum supported Rust
        run: |
          rustup toolchain install 1.87 --profile minimal
          cargo +1.87 test --locked

  app-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libjson-glib-dev libgtk-4-dev pkg-config dbus python3-gi xvfb
      - name: Lint
        run: cargo clippy -p runberth-app --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test -p runberth-app --locked
      - name: Tray, menu, and notifications
        run: |
          cargo build -p runberth-app --locked
          dbus-run-session -- python3 app/tests/tray_linux.py target/debug/runberth-app
      - name: Settings window opens
        # timeout exits with 124 when the app is still running after 5 seconds.
        run: xvfb-run -a dbus-run-session -- sh -c 'timeout 5 target/debug/runberth-app --settings; test $? -eq 124'

  app-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: cargo clippy -p runberth-app --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test -p runberth-app --locked
      - name: App bundle
        run: |
          app/scripts/build-macos-app.sh
          app/scripts/check-macos-app.sh
