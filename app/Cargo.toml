[package]
name = "runberth-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Menu bar and tray app for a Runberth server: connected repositories, jobs, and results"
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
# The macOS app's Xcode build links the library as a static library; see
# macos/build-rust.sh. Linux runs the binary.
name = "runberth_app"

[[bin]]
name = "runberth-app"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
